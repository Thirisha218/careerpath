{% extends "base.html" %}{% block body %}<div class="col-md-5 mx-auto"><h1 class="h3">Create your account</h1>
<p class="text-muted">We only ask for what we need. You can delete your account any time.</p>
<form method="post"><input type="hidden" name="_t" value="{{token}}">
<label class="form-label" for="n">Name</label><input id="n" name="name" class="form-control mb-3" required maxlength="80">
<label class="form-label" for="e">Email</label><input id="e" type="email" name="email" class="form-control mb-3" required>
<label class="form-label" for="p">Password (8+ characters)</label><input id="p" type="password" name="password" class="form-control mb-3" minlength="8" required>
<label class="form-label" for="s">12th stream</label><select id="s" name="stream" class="form-select mb-3"><option>Science</option><option>Commerce</option><option>Arts</option><option>Other</option></select>
<button class="btn btn-primary w-100">Create account</button></form></div>{% endblock %}
